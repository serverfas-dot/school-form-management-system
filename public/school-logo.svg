<svg width="200" height="200" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <!-- Outer green circle -->
  <circle cx="100" cy="100" r="95" fill="#10b981" stroke="#059669" stroke-width="3"/>

  <!-- Inner blue circle -->
  <circle cx="100" cy="100" r="80" fill="#3b82f6"/>

  <!-- White center circle -->
  <circle cx="100" cy="100" r="50" fill="white"/>

  <!-- School building icon -->
  <g transform="translate(100, 100)">
    <!-- Building base -->
    <rect x="-25" y="-15" width="50" height="35" fill="#3b82f6" rx="2"/>

    <!-- Roof -->
    <path d="M -30 -15 L 0 -30 L 30 -15 Z" fill="#1e40af"/>

    <!-- Windows -->
    <rect x="-18" y="-8" width="8" height="8" fill="white" rx="1"/>
    <rect x="-5" y="-8" width="8" height="8" fill="white" rx="1"/>
    <rect x="10" y="-8" width="8" height="8" fill="white" rx="1"/>

    <!-- Door -->
    <rect x="-5" y="5" width="10" height="15" fill="white" rx="1"/>
  </g>

  <!-- Top text arc -->
  <path id="topArc" d="M 30,100 A 70,70 0 0,1 170,100" fill="none"/>
  <text font-size="18" font-weight="bold" fill="white" font-family="Arial, sans-serif">
    <textPath href="#topArc" startOffset="50%" text-anchor="middle">
      FAAFU ATOLL SCHOOL
    </textPath>
  </text>

  <!-- Bottom text arc -->
  <path id="bottomArc" d="M 170,100 A 70,70 0 0,1 30,100" fill="none"/>
  <text font-size="14" font-weight="bold" fill="white" font-family="Arial, sans-serif">
    <textPath href="#bottomArc" startOffset="50%" text-anchor="middle">
      Republic of Maldives
    </textPath>
  </text>

  <!-- Stars -->
  <text x="25" y="105" font-size="12" fill="white">★</text>
  <text x="165" y="105" font-size="12" fill="white">★</text>
</svg>